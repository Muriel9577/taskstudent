<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Предмет - TaskStudent</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <a class="back" href="/">&larr; Усі предмети</a>
    <h1 id="subject-title">Предмет</h1>
    <p id="subject-pass" class="muted"></p>

    <section class="progress" aria-label="Прогрес по предмету">
      <div class="ring-box">
        <svg class="ring" viewBox="0 0 100 100" role="img" aria-label="Відсоток виконаних завдань">
          <circle class="ring-bg" cx="50" cy="50" r="44"></circle>
          <circle id="ring-fg" class="ring-fg" cx="50" cy="50" r="44" transform="rotate(-90 50 50)"></circle>
          <text id="ring-text" x="50" y="57" text-anchor="middle">0%</text>
        </svg>
        <p id="ring-caption" class="muted"></p>
      </div>
      <div class="score-box">
        <div class="bar" role="progressbar" aria-label="Бали відносно прохідного" aria-valuemin="0" aria-valuemax="100">
          <div id="bar-fill" class="bar-fill"></div>
        </div>
        <p id="score-text"></p>
        <p id="score-warn" class="warn" hidden></p>
      </div>
    </section>

    <h2>Завдання</h2>
    <form id="task-form" class="tasks-form">
      <input id="task-title" placeholder="Назва завдання" maxlength="100" required>
      <input id="task-deadline" type="date" title="Дедлайн">
      <input id="task-max" type="number" min="0" step="any" placeholder="Макс. бал" required>
      <button type="submit">Додати</button>
    </form>
    <ul id="tasks" class="list"></ul>
    <p id="tasks-empty" class="muted" hidden>Завдань ще немає. Додайте перше.</p>
    <p id="message" role="alert"></p>
  </main>
  <script src="/static/subject.js"></script>
</body>
</html>
